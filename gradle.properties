org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

GROUP=live.gravitylabs.porthole
VERSION_NAME=0.1.0-SNAPSHOT

# Publishing. Credentials never live here: put mavenCentralUsername,
# mavenCentralPassword and the in-memory signing key in ~/.gradle/gradle.properties
# or pass them as environment variables in CI.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=true

POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/gravityrepos/porthole

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/gravityrepos/porthole
POM_SCM_CONNECTION=scm:git:git://github.com/gravityrepos/porthole.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/gravityrepos/porthole.git

POM_DEVELOPER_ID=gravitylabs
POM_DEVELOPER_NAME=Gravity Labs
POM_DEVELOPER_URL=https://gravitylabs.live
