name: PR

# One workflow, run on every pull request and on every push to main. There is
# deliberately no publish path here: this workflow only ever runs tests and
# checks. It never runs a Gradle publish task, never `npm publish`, never a
# Vercel deploy, and it carries no registry credentials — that is an explicit
# acceptance criterion, not an oversight. A future ticket that wants this
# workflow to also publish needs its own credentials review; it does not get
# to grow into this one.
#
# GRA-190: the one exception to "no secrets" is `secrets.CODECOV_TOKEN`,
# referenced by name only in the coverage-upload steps below — nothing in
# this file or in any agent's context ever holds its value. The repo is
# public, so codecov-action's own tokenless upload is the fallback for as
# long as the secret is absent; `fail_ci_if_error: false` on every upload
# step means a missing or invalid token degrades coverage reporting, never
# the PR itself.
#
# The emulator, the AGP compatibility matrix and anything nightly are out of
# scope on purpose (see GRA-101) — they are slow and belong on their own
# schedule, not blocking every PR.
on:
  pull_request:
  push:
    branches:
      - main

# A new commit on the same PR (or the same branch) supersedes whatever this
# workflow was already running for that ref — nobody is waiting on a stale
# head commit's result once a newer one exists, and it frees the runner.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow reads the repository to build and test it,
# and writes nothing back anywhere — no PR comments, no pushed commits, no
# packages, no releases, no deployments. GITHUB_TOKEN gets exactly the one
# scope that requires, and every other scope defaults to "none".
permissions:
  contents: read

jobs:
  gradle:
    name: Gradle checks
    runs-on: ubuntu-latest
    # A generous ceiling, not the target. The ticket's target is a green PR
    # in under 8 minutes; this exists only to stop a genuinely wedged build
    # (a hung emulator-adjacent task, a network stall fetching the toolchain)
    # from burning CI minutes for hours instead of failing loudly.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GRA-98 added the foojay toolchain resolver to both settings.gradle.kts
      # files precisely so a runner whose default JDK is not 17 can still
      # resolve one for every `jvmToolchain(17)` in the build. This step's own
      # JDK only has to be new enough to run Gradle itself.
      #
      # No Android SDK setup step here: ubuntu-latest ships one preinstalled
      # (ANDROID_HOME already set), which is what the runtime module's AGP
      # tasks need. If GitHub ever changes that default image, this is the
      # first thing to check when this job starts failing on SDK location.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle User Home — dependencies, wrapper distribution and
      # build cache — keyed on the wrapper files and the build scripts,
      # including gradle/libs.versions.toml. That catalog is this build's
      # closest equivalent to a lockfile: every version the build resolves
      # against traces back to it. Deliberately not also setting `cache:
      # gradle` on setup-java above — that would be a second, cruder cache
      # keyed the same way, fighting this one instead of adding to it.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The one command this whole ticket exists to make trustworthy. Before
      # GRA-75, `./gradlew check` run from the root never reached
      # :gradle-plugin:test at all — the included build's lifecycle tasks
      # were not wired to the including build's, so a red plugin test could
      # sit underneath a green root build indefinitely. --warning-mode all
      # rather than the default `summary`: a build that quietly accumulates
      # deprecation warnings on every green run is a build nobody reads the
      # warnings of until they become the next major-version break.
      - name: ./gradlew check
        run: ./gradlew check --warning-mode all

      # GRA-190: gradle-plugin's own coverage XML is already produced above —
      # its `jacocoTestReport` task finalizes `test` (gradle-plugin/build.gradle.kts),
      # so `./gradlew check` already wrote it, pass or fail, before this step
      # runs. `runtime` has no such wiring: AGP's own generated report task
      # (`createDebugUnitTestCoverageReport` — the exact name for the AGP
      # version in gradle/libs.versions.toml, confirmed by running
      # `./gradlew :runtime:tasks --all` locally rather than assumed) is
      # invoked here instead, deliberately not finalizing `test` the way
      # gradle-plugin's does — see that module's build.gradle.kts. `if:
      # always()`, same reasoning as every other artifact step in this job:
      # a red suite should still upload whatever coverage it produced.
      # Measured (missing-input self-check): with the coverage `.exec` file
      # absent, this task fails the build outright ("input file ... doesn't
      # exist") rather than silently writing an empty report — the opposite
      # of gradle-plugin's own `jacocoTestReport`, which SKIPs quietly when
      # its input is missing. Recorded here because the two report tasks
      # disagree on this, not because either one changed for it.
      - name: Coverage report (runtime, JaCoCo XML)
        if: always()
        run: ./gradlew :runtime:createDebugUnitTestCoverageReport --warning-mode all

      # GRA-159: a green ./gradlew check tells you every test that ran
      # passed, not how many ran. This reads the JUnit XML every JVM test
      # task already writes under */build/test-results/**, whether check
      # above passed or failed, and prints the one thing that XML normally
      # only exists to feed an HTML report nobody opens on a green build:
      # total/passed/failed/skipped, and the skipped tests by name. The
      # skipped set is the actual signal — see GRA-159 for the four times a
      # test silently not running was mistaken for a test passing.
      #
      # Plain xml.etree rather than a new dependency: this file only owns
      # this workflow, and the input is Gradle's own trusted test-result
      # output from the same job, not attacker-controlled XML.
      - name: Print JVM test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          total = passed = failed = skipped = 0
          skipped_names = []
          failed_names = []

          paths = sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True))
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              suite_name = root.get("name", path)
              for tc in root.findall("testcase"):
                  total += 1
                  name = f"{tc.get('classname', suite_name)} > {tc.get('name', '?')}"
                  if tc.find("skipped") is not None:
                      skipped += 1
                      skipped_names.append(name)
                  elif tc.find("failure") is not None or tc.find("error") is not None:
                      failed += 1
                      failed_names.append(name)
                  else:
                      passed += 1

          lines = ["### Gradle (JVM) test summary", ""]
          if not paths:
              lines.append("No JUnit XML found under **/build/test-results/ — the test tasks did not run or produced no output.")
          else:
              lines.append(f"total: {total}  passed: {passed}  failed: {failed}  skipped: {skipped}")
              lines.append("")
              if skipped_names:
                  for n in skipped_names:
                      lines.append(f"- skipped: {n}")
              else:
                  lines.append("no skipped tests")
              for n in failed_names:
                  lines.append(f"- failed: {n}")

          text = "\n".join(lines)
          print(text)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(text + "\n")
          PY

      # AC1's artifact, split out from the HTML reports below and uploaded
      # on every run, not just on failure: the defect this ticket exists for
      # (GRA-75, GRA-137, GRA-144, and the local.properties skip GRA-150
      # hit) is invisible precisely on green builds, so the evidence has to
      # survive a passing run too. Kept small on purpose — just the XML, a
      # few hundred KB across every module — so this stays seconds, not
      # minutes, on the common case of a green PR.
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-junit-xml
          path: '**/build/test-results/'
          if-no-files-found: warn

      # GRA-190: one flag, two XML files — gradle-plugin's jacoco report and
      # runtime's AGP-generated one, both from the steps above. `if:
      # always()`: a red suite still uploads whatever coverage it produced,
      # matching `codecov.yml`'s `require_ci_to_pass: false`. No token
      # secret is ever printed or read by this workflow — it is handed to
      # the action by reference (`secrets.CODECOV_TOKEN`) and the action
      # itself falls back to tokenless upload if the secret is absent, which
      # is the expected path until the founder creates it in repo settings.
      # `fail_ci_if_error: false`: a Codecov outage must never fail a PR —
      # this check is informational (`codecov.yml`) and the upload should be
      # too. `disable_search: true`: codecov-action's own `files:` input
      # description says its named files "will be added to the coverage
      # files found for upload" — it is additive to a repo-wide auto-search,
      # not exclusive, unless search is turned off. Left on, this step could
      # also sweep up whatever the Node job's coverage looks like on a
      # shared runner, or a stray report elsewhere in the tree, and tag it
      # `jvm` too. Confirmed from the action's own action.yml
      # (`disable_search`'s description: "Disable search for coverage
      # files. This is helpful when specifying what files you want to
      # upload") rather than assumed.
      - name: Upload coverage to Codecov (jvm)
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: jvm
          files: gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml,runtime/build/reports/coverage/test/debug/report.xml
          disable_search: true
          fail_ci_if_error: false

      # GRA-164: unit tests for the parsing this check relies on (thousands-
      # separator rejection especially — see the checker's own file for
      # why). Needs no JUnit XML, no build output, nothing this job
      # produces — it is pure text-parsing tests against literal strings —
      # so it runs unconditionally rather than `if: always()`.
      - name: Test the README JVM check's own parsing
        run: python3 tools/test_check_readme_test_counts.py

      # GRA-164: the summary step above prints a number a human has to read
      # and copy into README.md by hand, which is exactly how README.md's
      # JVM figure went stale three times in one day. This reads the same
      # XML and fails the build instead, naming README's figure next to the
      # suite's the moment they disagree. This job only ever runs on
      # ubuntu-latest, so the full split always applies here; the script
      # also compiles a Windows/macOS branch for when an implementer runs it
      # by hand off this job, same reasoning as the `node` job's check below.
      - name: Check README JVM test count
        if: always()
        run: python3 tools/check-readme-test-counts.py

      # The heavier HTML reports stay failure-only, unchanged from before
      # this ticket: they are for a human digging into a red build, not for
      # the every-PR signal AC1 asks for, and uploading them unconditionally
      # would cost real time on every green run for no one to ever open.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: warn

      # site/api (Dokka's HTML) and the generated PortholeVersion.kt are the
      # two files a build in this repo could regenerate differently than what
      # is committed. Checked by hand before wiring this in: `check` never
      # runs the `apiDocs` task that produces site/api (that task is
      # registered but not attached to any lifecycle task — see
      # runtime/build.gradle.kts — and is only ever run by hand before a
      # deploy), and PortholeVersion.kt is written under build/, which git
      # never tracks in the first place. So today this step never fires. It
      # stays in anyway as a tripwire: the day either of those gets wired into
      # `check`, or a new generated-and-committed file joins them, this is
      # what turns a silent rewrite of checked-in output into a failed PR
      # instead of a diff nobody notices until review.
      - name: Fail on uncommitted changes from the build
        run: git diff --exit-code

  node:
    name: Node (${{ matrix.os }})
    strategy:
      # One platform's failure should not hide whether the other two pass —
      # this is a matrix specifically about platform-shaped bugs, so seeing
      # all three results matters more than failing fast.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        # Git Bash on the Windows runner, so the multi-line steps below (the
        # tarball check especially) read the same on all three platforms
        # instead of half of them needing pwsh syntax.
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run build

      # GRA-172: `npm run build` type-checks src/ through tsc, but tsconfig.json
      # excludes src/testing/** and *.test.ts on purpose (see that file's own
      # comment — publishing dist/testing/ was GRA-90's tarball bug), so a type
      # error there has always left `tsc --noEmit` and this build step both at
      # exit 0. src/testing/stripComments.ts is now the shared engine behind
      # the ConnectionState guard (surface.test.ts) and the PROTOCOL_VERSION
      # drift scan (device.test.ts) — the project's only two source-text
      # guards — so a silent type error in it would leave both unable to see
      # their own input with nothing here saying so. This step runs a second,
      # noEmit-only project (tsconfig.typecheck.json) that covers everything
      # tsconfig.json excludes except *.test.ts (fixing pre-existing vitest
      # mock-typing errors in test files is a separate, wider change — see
      # GRA-172's Linear comment). noEmit means this can never write to dist/
      # or change what `npm pack` publishes; it only fails the job on a type
      # error, the same way the build step above already does for the rest of
      # src/.
      - name: Type-check src/testing/ (tsc --noEmit, second project)
        run: npm run typecheck:src

      # GRA-164: unit tests for the parsing check-readme-vitest-counts.mjs
      # relies on (thousands-separator rejection especially). node:test, not
      # vitest, and deliberately not wired through `npm test` — see the test
      # file's own header for why it must stay off vitest's include globs.
      # Needs no JUnit XML — pure text-parsing tests against literal
      # strings — so it can run right after the dependencies it imports
      # (node:fs, node:url, node:path, node:os — all built in) exist.
      #
      # GRA-175: run through run-node-test-with-floor.mjs, not `node --test`
      # directly. Measured: `node --test` treats a file that registers ZERO
      # real test() calls exactly like one that registers a single passing
      # test — "tests 1, pass 1", exit 0 either way — so a rename, a moved
      # file, or a swallowed import error here would have stayed green
      # forever. See the wrapper's own header for why its floor is a
      # structural "more than 1", not a count that needs updating.
      - name: Test the README server/UI check's own parsing
        run: node scripts/run-node-test-with-floor.mjs scripts/check-readme-vitest-counts.test.mjs

      # `npm test` at the mcp root runs only the server-side vitest suite —
      # it does not reach mcp/ui's tests at all, silently, because its script
      # in mcp/package.json never calls the ui workspace's `test`. The
      # preferred fix is making `npm test` itself run both suites, but that is
      # an edit to mcp/package.json, which GRA-97 merged into main today and
      # which this ticket does not own (this ticket's `Owns` line is
      # `.github/workflows/pr.yml` and `README.md#ci` only). Calling both
      # scripts here is the workaround; fixing `npm test` is left as a
      # follow-up for whoever next owns mcp/package.json.
      #
      # GRA-159: both suites now also write JUnit XML, invoked as `npx
      # vitest run` directly rather than through the npm scripts above —
      # `npm test -- <args>` forwards extra flags fine, but `npm run test:ui`
      # is itself `npm run test --workspace porthole-ui`, and a second layer
      # of `npm run` does not forward a third `--` (checked by hand: the
      # reporter flags never reached vitest through it). Calling `vitest run`
      # straight, with the same config each package already has, runs the
      # exact same tests the two scripts above run — only the reporter
      # changes, never the test selection.
      # GRA-190: coverage flags added to these same two invocations rather
      # than a third command — the JUnit reporter flags and output paths
      # above are unchanged, byte-identical to what GRA-159 already relies
      # on, so the README drift checks below still read the same XML they
      # always did. `--coverage.reportsDirectory` rather than the v8
      # provider's own default (`coverage/`) so the server and UI reports
      # land in one predictable place — `mcp/coverage/{server,ui}/` — for
      # the Codecov upload steps further down to name explicitly.
      # `--coverage.reporter=lcov` only: no `text` reporter, so this adds no
      # console output to a step whose job is the JUnit XML, not a coverage
      # summary a human would read here (Codecov renders that instead).
      # Exclusions (test files, mcp/src/testing/**, dist/**, and — measured
      # necessary, not just mcp/ui/dist/** — the whole of ui/** from the
      # server's own report, since v8's `coverage.all` default otherwise
      # walks mcp/ui/src/** too and reports it as untested "server" code)
      # live in mcp/vitest.config.ts and mcp/ui/vite.config.ts, not here —
      # per the ticket, config rather than the command line, so they apply
      # the same way to a local `--coverage` run as to this step.
      - name: npm test (server suite, + JUnit XML)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/server-junit.xml --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage/server
      - name: npm run test:ui (+ JUnit XML)
        working-directory: mcp/ui
        run: npx vitest run --reporter=default --reporter=junit --outputFile=../test-results/ui-junit.xml --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=../coverage/ui

      # Same instrument as the Gradle job, same reason: a green matrix leg
      # here is exactly where the server suite's one real skip (the
      # trace_processor end-to-end test, GRA-144) goes unnoticed today.
      # Regex-based, not an XML library: vitest's own junit reporter always
      # writes one flat <testcase> per test with an optional nested
      # <skipped/> or <failure>, so this reads that shape directly rather
      # than adding a dependency for a format this workflow's own steps just
      # produced.
      - name: Print vitest test summary
        if: always()
        run: |
          node -e '
            const { readFileSync, readdirSync, existsSync, appendFileSync } = require("node:fs");
            const { join } = require("node:path");

            const dir = "test-results";
            const files = existsSync(dir)
              ? readdirSync(dir).filter((f) => f.endsWith(".xml")).sort()
              : [];

            const lines = ["### Node (vitest, ${{ matrix.os }}) test summary", ""];
            if (files.length === 0) {
              lines.push("No JUnit XML found under mcp/test-results/ — the test steps did not produce output.");
            }

            const decode = (s) =>
              s.replace(/&gt;/g, ">").replace(/&lt;/g, "<").replace(/&quot;/g, "\"").replace(/&apos;/g, "'"'"'").replace(/&amp;/g, "&");

            for (const file of files) {
              const xml = readFileSync(join(dir, file), "utf8");
              let total = 0, passed = 0, failed = 0, skipped = 0;
              const skippedNames = [];
              const failedNames = [];
              const testcaseRe = /<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g;
              let m;
              while ((m = testcaseRe.exec(xml))) {
                const attrs = m[1];
                const body = m[3] || "";
                const nameMatch = attrs.match(/\bname="([^"]*)"/);
                const classMatch = attrs.match(/\bclassname="([^"]*)"/);
                const name = decode(`${classMatch ? classMatch[1] + " > " : ""}${nameMatch ? nameMatch[1] : "?"}`);
                total++;
                if (/<skipped\b/.test(body)) {
                  skipped++;
                  skippedNames.push(name);
                } else if (/<failure\b/.test(body) || /<error\b/.test(body)) {
                  failed++;
                  failedNames.push(name);
                } else {
                  passed++;
                }
              }
              lines.push(`**${file}** — total: ${total}  passed: ${passed}  failed: ${failed}  skipped: ${skipped}`);
              for (const n of skippedNames) lines.push(`- skipped: ${n}`);
              for (const n of failedNames) lines.push(`- failed: ${n}`);
              lines.push("");
            }

            const text = lines.join("\n");
            console.log(text);
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
            }
          '

      # Always, not on failure: same reasoning as the Gradle job's upload.
      # One name per OS leg — upload-artifact rejects two uploads with the
      # same name in one run, and this matrix has three.
      - name: Upload vitest test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-test-results-${{ matrix.os }}
          path: mcp/test-results/
          if-no-files-found: warn

      # GRA-190: one Codecov upload per flag, per OS leg — three legs upload
      # the same two flags across this matrix, and Codecov merges same-flag
      # uploads rather than treating a later one as a replacement. `files:`
      # names the exact lcov path each vitest invocation above was just told
      # to write (`--coverage.reportsDirectory`), relative to the repo root
      # regardless of this job's own `working-directory: mcp` default — a
      # `uses:` step (unlike a `run:` step) does not inherit that default at
      # all, and codecov-action's own `directory` input defaults to "the
      # current working directory", which for a `uses:` step is
      # `GITHUB_WORKSPACE`. `if: always()` and `fail_ci_if_error: false` for
      # the same reasons as the Gradle job's upload: a red suite still
      # uploads what it produced, and a Codecov outage never fails a PR.
      # `disable_search: true`: without it, `files:` is additive to a
      # repo-wide auto-search (confirmed in the action's own action.yml —
      # see the Gradle job's upload comment above), so the `server` step
      # could also sweep up `mcp/coverage/ui/lcov.info`, and vice versa,
      # tagging one suite's coverage with the other's flag.
      - name: Upload coverage to Codecov (server)
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: server
          files: mcp/coverage/server/lcov.info
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage to Codecov (ui)
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ui
          files: mcp/coverage/ui/lcov.info
          disable_search: true
          fail_ci_if_error: false

      # GRA-164: same defect as the Gradle job's summary step above — a
      # number a human has to copy into README.md by hand goes stale, and
      # README's server/UI figures had. This reads the JUnit XML this job
      # just wrote and fails instead of printing. It runs on all three legs
      # of this matrix, but README's passed/failed/skipped split names
      # ubuntu-latest specifically (the skip set is not the same on every
      # platform), so the script only compares the total on windows-latest
      # and macos-latest and says so rather than failing for a reason that
      # has nothing to do with drift. Run from mcp/ (this job's working
      # directory) — the script resolves README.md and the XML relative to
      # its own path, not the cwd.
      - name: Check README server test count
        if: always()
        run: node scripts/check-readme-vitest-counts.mjs server
      - name: Check README timeline-UI test count
        if: always()
        run: node scripts/check-readme-vitest-counts.mjs ui

      - run: npm run lint

      # `npm pack --dry-run` writes its human-readable file list to stderr,
      # and that output's exact wording has already changed across npm
      # versions and reads slightly differently by platform — matching it as
      # text would make this step flaky on exactly the windows and macos legs
      # it most needs to be reliable on. `--json` is the stable alternative:
      # it is what produced expected-package-files.txt in the first place
      # (see that file's own header), and it is written to stdout as
      # parseable JSON on every platform and every npm version tested here.
      # The one thing still normalised by hand is the content hash Vite
      # stamps into the UI's built asset filenames — it changes on every UI
      # edit and says nothing about which files ended up in the tarball.
      - name: Check npm tarball contents against expected-package-files.txt
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const fs = require("node:fs");

            const raw = execSync("npm pack --dry-run --json", { encoding: "utf8" });
            const packed = JSON.parse(raw)[0].files.map((f) => f.path.replace(/\\/g, "/"));

            const normalise = (p) =>
              p.replace(/(ui\/dist\/assets\/index-)[^./]+(\.(css|js))$/, "$1*$2");

            const actual = packed.map(normalise).sort();
            const expected = fs
              .readFileSync("expected-package-files.txt", "utf8")
              .split(/\r?\n/)
              .map((l) => l.trim())
              .filter((l) => l && !l.startsWith("#"))
              .sort();

            const actualText = actual.join("\n");
            const expectedText = expected.join("\n");

            if (actualText !== expectedText) {
              console.error("Packed tarball contents do not match mcp/expected-package-files.txt.");
              console.error("If this file list change was intentional, update the fixture.");
              console.error("--- expected ---");
              console.error(expectedText);
              console.error("--- actual ---");
              console.error(actualText);
              process.exit(1);
            }

            console.log(`npm pack matches expected-package-files.txt (${actual.length} files).`);
          '

      # Same tripwire as the Gradle job, same two files. Neither is written by
      # anything `npm run build` touches, so this is a no-op today and cheap
      # insurance against tomorrow.
      - name: Fail on uncommitted changes from the build
        run: git diff --exit-code
