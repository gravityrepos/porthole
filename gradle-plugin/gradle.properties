# The plugin is its own Gradle build (settings.gradle.kts includes it), so the
# root project's gradle.properties does not reach it either.

# Same reason, for the two settings that decide what is cached. Inside the
# root's build tree the root's values govern the whole tree, so these change
# nothing there; they matter for `./gradlew -p gradle-plugin test`, which starts
# this build on its own and would otherwise run with the defaults — no build
# cache, no configuration cache. Two ways of running the same tests that
# disagree about caching disagree about which tasks were up to date, and that
# argument costs an afternoon to settle. Keep these equal to the root's.
org.gradle.caching=true
org.gradle.configuration-cache=true

GROUP=live.gravitylabs.porthole

# No POM_* properties here. This build applies only `kotlin-dsl` and
# `com.gradle.plugin-publish`, not the vanniktech `com.vanniktech.maven.publish`
# plugin that runtime/ and runtime-noop/ use — the one that actually reads
# POM_NAME, POM_DESCRIPTION, POM_LICENSE_*, POM_SCM_* and POM_DEVELOPER_* out of
# a gradle.properties file. A full POM_* set used to sit here anyway, commented
# as "kept in step with the root", and did nothing: `publishToMavenLocal`'s
# generated POM has no name, description, licence, SCM or developers, because
# nothing in this build ever reads these keys. The plugin's own user-facing
# metadata (name, description, website, vcs URL, tags) is set once, correctly,
# in gradle-plugin/build.gradle.kts's `gradlePlugin { plugins { ... } }` block —
# that is the file `com.gradle.plugin-publish` actually looks at. Wiring a
# `publishing { publications { ... } }` block to make POM_* live again would
# mean editing build.gradle.kts, which this fix does not touch.
