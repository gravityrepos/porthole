# The plugin is its own Gradle build (settings.gradle.kts includes it), so the
# root project's POM metadata does not reach it. Declared here instead, and kept
# in step with the root gradle.properties.

# Same reason, for the two settings that decide what is cached. Inside the
# root's build tree the root's values govern the whole tree, so these change
# nothing there; they matter for `./gradlew -p gradle-plugin test`, which starts
# this build on its own and would otherwise run with the defaults — no build
# cache, no configuration cache. Two ways of running the same tests that
# disagree about caching disagree about which tasks were up to date, and that
# argument costs an afternoon to settle. Keep these equal to the root's.
org.gradle.caching=true
org.gradle.configuration-cache=true

GROUP=live.gravitylabs.porthole
POM_ARTIFACT_ID=gradle-plugin
POM_NAME=Porthole Gradle Plugin
POM_DESCRIPTION=Wires the debug-only Porthole runtime into an Android app, generates its port resource, and owns the adb forward the timeline UI and MCP server connect through.
POM_URL=https://github.com/gravityrepos/porthole
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/gravityrepos/porthole
POM_SCM_CONNECTION=scm:git:git://github.com/gravityrepos/porthole.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/gravityrepos/porthole.git
