<!--
  Source for site/og.png, the social card. Rendered by brand/render.mjs, which
  drives headless Chrome so the real brand font is fetched and baked into the
  PNG rather than falling back to whatever the viewer happens to have.

  Exactly 1200x630 — the aspect every card scraper expects. Nothing here may
  overflow that box.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --teal: #5ec8b0;
        --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
        --sans: "Space Grotesk", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: radial-gradient(110% 130% at 12% -10%, #1a2331 0%, #0f141d 55%, #0d1117 100%);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .rules {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image: linear-gradient(to right, #1c2331 1px, transparent 1px);
        background-size: 8.333% 100%;
      }
      /* The mark again, oversized and cropped: a porthole you look through. */
      .aperture {
        position: absolute;
        right: -300px;
        bottom: -330px;
        width: 880px;
        height: 880px;
        border: 2px solid var(--teal);
        border-radius: 50%;
        opacity: 0.16;
      }
      main {
        position: relative;
        height: 100%;
        padding: 78px 84px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .wordmark span {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #f2f6fb;
      }
      h1 {
        margin: 0;
        max-width: 15ch;
        font-size: 74px;
        font-weight: 600;
        line-height: 1.03;
        letter-spacing: -0.028em;
        color: #f4f7fb;
      }
      p {
        margin: 0;
        max-width: 46ch;
        font-size: 24px;
        line-height: 1.45;
        color: #a8b4c4;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 26px;
        font-family: var(--mono);
        font-size: 16px;
        color: #9aa6b8;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
      .legend i {
        width: 11px;
        height: 11px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="rules"></div>
    <div class="aperture"></div>
    <main>
      <div class="wordmark">
        <svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true">
          <circle cx="16" cy="16" r="13.2" fill="none" stroke="#5ec8b0" stroke-width="3" />
          <circle cx="16" cy="16" r="3.5" fill="#5ec8b0" />
        </svg>
        <span>PORTHOLE</span>
      </div>
      <h1>A window into your running app</h1>
      <p>
        A debug-only window into a running Android app — for the developer watching it, and the
        coding agent fixing it.
      </p>
      <div class="legend">
        <span><i style="background: #f0883e"></i>recompose</span>
        <span><i style="background: #a371f7"></i>state</span>
        <span><i style="background: #f85149"></i>frames</span>
        <span><i style="background: #56c88c"></i>nav</span>
        <span><i style="background: #539bf5"></i>http</span>
        <span><i style="background: #e3b341"></i>db</span>
        <span><i style="background: #db61a2"></i>work</span>
        <span><i style="background: #6cb6ff"></i>memory</span>
        <span><i style="background: #56d4dd"></i>device</span>
      </div>
    </main>
  </body>
</html>
