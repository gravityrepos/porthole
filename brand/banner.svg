<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     role="img" aria-label="Porthole — a debug-only window into a running Android app">
  <title>Porthole</title>
  <defs>
    <radialGradient id="ground" cx="12%" cy="0%" r="150%">
      <stop offset="0" stop-color="#1a2331"/>
      <stop offset="55%" stop-color="#0f141d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <pattern id="grid" width="106.67" height="320" patternUnits="userSpaceOnUse">
      <rect width="1" height="320" fill="#1c2331"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#ground)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- The mark again, oversized and cropped: a porthole you are looking through. -->
  <circle cx="1240" cy="365" r="216" fill="none" stroke="#5ec8b0" stroke-width="2" opacity="0.16"/>

  <g transform="translate(90 96)">
    <circle cx="21" cy="21" r="17.3" fill="none" stroke="#5ec8b0" stroke-width="3.4"/>
    <circle cx="21" cy="21" r="4.6" fill="#5ec8b0"/>
  </g>

  <text x="146" y="126" font-family="'Space Grotesk',system-ui,sans-serif" font-size="34"
        font-weight="700" letter-spacing="5.44" fill="#f2f6fb">PORTHOLE</text>

  <text x="90" y="176" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" fill="#b6c1d0">
    A debug-only window into a running Android app — for the developer watching it,
  </text>
  <text x="90" y="198" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" fill="#b6c1d0">
    and the coding agent fixing it.
  </text>

  <g font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="11.5" fill="#9aa6b8">
    <rect x="90"  y="234" width="8" height="8" rx="2" fill="#f0883e"/><text x="105" y="242">recompose</text>
    <rect x="196" y="234" width="8" height="8" rx="2" fill="#a371f7"/><text x="211" y="242">state</text>
    <rect x="272" y="234" width="8" height="8" rx="2" fill="#f85149"/><text x="287" y="242">frames</text>
    <rect x="356" y="234" width="8" height="8" rx="2" fill="#56c88c"/><text x="371" y="242">nav</text>
    <rect x="418" y="234" width="8" height="8" rx="2" fill="#539bf5"/><text x="433" y="242">http</text>
    <rect x="482" y="234" width="8" height="8" rx="2" fill="#e3b341"/><text x="497" y="242">db</text>
    <rect x="534" y="234" width="8" height="8" rx="2" fill="#db61a2"/><text x="549" y="242">work</text>
    <rect x="604" y="234" width="8" height="8" rx="2" fill="#6cb6ff"/><text x="619" y="242">memory</text>
    <rect x="694" y="234" width="8" height="8" rx="2" fill="#56d4dd"/><text x="709" y="242">device</text>
  </g>
</svg>
