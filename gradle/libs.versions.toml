# Bump these to whatever your app is on. The runtime only needs Compose >= 1.5
# and kotlinx-serialization; nothing here is pinned for behaviour.
[versions]
# Porthole's own release version, and the only place it is written. The
# runtime, the no-op, the plugin and the version the plugin hands consumers
# all read this; PortholeVersion.kt is generated from it.
porthole = "0.2.2"

agp = "8.13.2"
kotlin = "2.1.0"
composeBom = "2025.01.00"
serialization = "1.8.0"
coroutines = "1.10.1"
startup = "1.2.0"
navigation = "2.8.6"
okhttp = "4.12.0"
okio = "3.9.1"
junit = "4.13.2"
robolectric = "4.14.1"
mavenPublish = "0.37.0"
ksp = "2.1.0-1.0.29"
activity = "1.10.0"
lifecycleVm = "2.8.7"
room = "2.6.1"
work = "2.10.0"
sqlite = "2.4.0"
sqldelight = "2.0.2"
ktor = "3.0.3"
dokka = "2.2.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
# navigation-runtime, not navigation-compose: the collector only touches
# NavController, NavBackStackEntry and NavDestination.
androidx-navigation-runtime = { module = "androidx.navigation:navigation-runtime", version.ref = "navigation" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
# The base artifact, not -compose: ComponentActivity and FullyDrawnReporter
# live here. compileOnly is non-transitive (see the okio comment below), and
# activity-compose alone would not put this on the compile classpath.
#
# No version.ref on purpose: `runtime`'s own compileOnly navigation-runtime
# already pulls androidx.activity:activity in transitively, and AGP's
# consistent-resolution strictly pins runtime's own compile classpath to
# whatever version that transitive graph resolves to at build time
# (1.7.0 as of navigation 2.8.6) — a version.ref here that disagreed with
# it would conflict outright rather than simply losing a version-resolution
# tie-break, since "strictly" refuses every other version, not just older
# ones. Leaving this unversioned asks for whatever that resolution already
# settled on, which — since FullyDrawnReporter is a 1.7.0 API — is already
# new enough for what this module needs.
androidx-activity = { module = "androidx.activity:activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleVm" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# compileOnly is non-transitive, so okio has to be named explicitly for Buffer.
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# for the gradle-plugin build
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# GRA-69: portholeComposeReport reads (and, when requested, configures) the
# same composeCompiler {} extension `compose-compiler` (the plugin alias, in
# [plugins] below) registers on a consuming module — compileOnly, same
# reasoning as agp-api: the consumer always brings its own copy by applying
# that plugin, this only needs its types to compile against.
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
